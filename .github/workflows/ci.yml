name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Preview build (pending content shown): behaviour, layout and accessibility.
      - run: npm run test:e2e
      # Public build, exactly as deployed: the publication check, then clean pages and byte budgets.
      - run: npm run test:public
      - run: npm run test:blog:flow
      - run: npm run build
      - run: node scripts/check-blog-urls.mjs
